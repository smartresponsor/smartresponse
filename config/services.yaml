# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    - { resource: '../vendor/applicating/application/config/component/services.yaml' }
    - { resource: '../vendor/localizing/locale/config/services.yaml' }
    - { resource: '../vendor/cataloging/catalog/config/component/services.yaml' }
    - { resource: '../vendor/vendoring/vendor/config/component/optional/attaching_profile_bridge.yaml' }

parameters:
    redis.dsn: 'redis://127.0.0.1:6379/0'
    paying.messenger.dsn: 'sync://'
    app.back_uri_token_default: 'ea'
    app.back_uri_token: '%env(default:app.back_uri_token_default:APP_BACK_URI_TOKEN)%'
    stripe.secret_key_default: ''
    stripe.connect_webhook_secret_default: ''
    app.crud.attachment_owner_type_by_resource_path:
        vendor: vendor
        project: project
        product: product

    app.object_visibility.transition_map:
        publish:
            writes:
                setPublished: true
                setVisible: true
        archive:
            writes:
                setArchived: true
                setVisible: false
        draft:
            writes:
                setDraft: true
                setPublished: false
                setVisible: false

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Fixture/'
            - '../src/DataFixtures/'
            - '../src/Kernel.php'
            - '../src/Controller/Access/AccessApiController.php'
            - '../src/EventSubscriber/Projecting/ProjectingVendorSlaRateLimitSubscriber.php'
            - '../src/Service/Paying/PaymentDemoPayoutRailService.php'

    App\Service\Runtime\AppEffectiveRuntimeService:
        arguments:
            $centralHostOrigin: '%env(default:app.base_uri_default:APP_BASE_URI)%'

    App\Messaging\Service\Thread\MessageMentionService: ~
    App\Messaging\Service\Moderation\MessageModerationAppealService: ~
    App\Messaging\Service\Moderation\MessageTrustOverrideService: ~
    App\Messaging\Service\MessageAIModerationService: ~
    App\Messaging\Service\Moderation\MessageModerationRuleEngineService: ~
    App\Messaging\Service\Observability\MessagePrometheusMetricsService: ~
    App\Messaging\Service\Outbox\MessageOutboxService: ~

    App\Service\Dashboard\AppDashboardBuilderService:
        public: true
        arguments:
            $interfaceLocationProjectionProvider: '@navigating.interface_location_projection_provider'
        tags: ['controller.service_arguments']
    App\Service\Diagnostics\AppRouteAuditService:
        public: true
        tags: ['controller.service_arguments']
    App\Vendoring\Repository\Vendor\VendorPayoutAccountRepository:
        autowire: false
        arguments:
            $registry: '@doctrine'
    App\Vendoring\Repository\Vendor\VendorPayoutRepository:
        autowire: false
        arguments:
            $registry: '@doctrine'
    App\Service\Vendoring\Runtime\Mobile\VendorMobilePayoutShowService:
        public: true
        tags: ['controller.service_arguments']
    App\Vendoring\Service\Vendor\Profile\VendorProfileHttpService:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Vendoring\Service\Vendor\Statement\VendorStatementHttpService:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Vendoring\Service\Vendor\Summary\VendorSummaryHttpService:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Vendoring\Service\Vendor\Transaction\VendorTransactionHttpService:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Command\AppUrlAuditInventoryCommand:
        tags: ['console.command']
    App\Command\AppUrlAuditRunCommand:
        tags: ['console.command']
    App\Command\AppUrlAuditPublishGitHubCommand:
        tags: ['console.command']
    App\Command\GatingCheckCommand:
        tags: ['console.command']
    App\Accessing\Command\AccessDemoResetCommand:
        arguments:
            $fixturesLoader: '@?doctrine.fixtures.loader'
        tags: ['console.command']
    App\Vendoring\DataFixtures\VendorAccessBootstrapFixture: ~
    App\Accessing\Service\Http\Api\Access\AccessApiFlowService:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Controller\Access\AccessApiController:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Controller\Wallet\WalletApiController:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Controller\Paying\StripeConnectPayoutWebhookController:
        public: true
        autowire: true
        autoconfigure: true
        arguments:
            $webhookSecret: '%env(default:stripe.connect_webhook_secret_default:STRIPE_CONNECT_WEBHOOK_SECRET)%'
        tags: ['controller.service_arguments']
    App\Accessing\ProviderInterface\PhoneVerification\AccessPhoneVerificationProviderInterface:
        alias: App\Provider\Access\AccessDeliveringPhoneVerificationProvider
    App\Service\Fact\FactCurrentSubjectProvider:
        autowire: true
        autoconfigure: true
    App\ServiceInterface\Fact\FactCurrentSubjectProviderInterface:
        alias: App\Service\Fact\FactCurrentSubjectProvider
    App\Delivering\ServiceInterface\Command\Delivery\DeliveringPushTokenResolverInterface:
        alias: App\Resolver\Notification\NotifyingPushTokenResolver
    App\Cataloging\Controller\Catalog\CatalogCategoryMerchantController:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Cataloging\Controller\Catalog\CatalogLegacyCategoryListController:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    App\Cataloging\Controller\Catalog\CatalogLegacyCollectionListController:
        public: true
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']
    doctrine.dbal.default_connection:
        alias: doctrine.dbal.postgres_connection
    doctrine.orm.data_entity_manager:
        alias: doctrine.orm.postgres_entity_manager

    App\Manager\ObjectMeta\ObjectVisibilityManager:
        arguments:
            $transitionMap: '%app.object_visibility.transition_map%'

    App\EventSubscriber\Crud\AttachmentOwnerPurgeLifecycleSubscriber:
        arguments:
            $ownerTypeByResourcePath: '%app.crud.attachment_owner_type_by_resource_path%'
        tags: ['cruding.mutation_lifecycle_subscriber']

    App\EventSubscriber\Placement\Retail\RetailPlacementOrderLifecycleSubscriber:
        tags: ['cruding.mutation_lifecycle_subscriber']

    App\Service\Shipping\ShipmentAddressService:
        arguments:
            $inner: '@App\Shipping\Service\ShipmentService'

    App\Service\Paying\PaymentStripePayoutRailService:
        arguments:
            $secretKey: '%env(default:stripe.secret_key_default:STRIPE_SECRET_KEY)%'
        tags: ['app.paying.payout_rail']

    App\Service\Withdrawing\WithdrawalWalletSourceService:
        tags: ['app.withdrawing.source']
    App\Service\Withdrawing\WithdrawalPaymentRailService:
        arguments:
            $rails: !tagged_iterator app.paying.payout_rail
        tags: ['app.withdrawing.rail']

    App\Locating\Service\Address\Location\AddressParser: ~
    App\Locating\ServiceInterface\Address\Location\AddressParserInterface:
        alias: App\Locating\Service\Address\Location\AddressParser
    App\Locating\Service\Address\Location\AddressNormalizer: ~
    App\Locating\ServiceInterface\Address\Location\AddressNormalizerInterface:
        alias: App\Locating\Service\Address\Location\AddressNormalizer
    App\Locating\Service\Address\Location\AddressValidator: ~
    App\Locating\ServiceInterface\Address\Location\AddressValidatorInterface:
        alias: App\Locating\Service\Address\Location\AddressValidator
    App\Locating\Service\Address\Location\AddressPipeline: ~
    App\Locating\ServiceInterface\Address\Location\AddressPipelineInterface:
        alias: App\Locating\Service\Address\Location\AddressPipeline

    App\Shipping\Service\Http\Shipment\ShipmentNewService:
        arguments:
            $shipmentService: '@App\Service\Shipping\ShipmentAddressService'

    navigating.walleting_database_config_debug:
        alias: App\Navigating\Service\Navigation\Provide\NavigationDatabaseConfigProvideService
        public: true

    App\ServiceInterface\Dashboard\AppDashboardBuilderServiceInterface: '@App\Service\Dashboard\AppDashboardBuilderService'
    App\Interfacing\ProviderInterface\Localization\InterfaceLocaleTemplateSelectorProviderInterface:
        alias: App\Provider\Localization\AppLocaleTemplateSelectorProvider
    App\Interfacing\ProviderInterface\Localization\InterfaceLocaleTemplateContextProviderInterface:
        alias: App\Provider\Localization\AppLocaleTemplateContextProvider
    App\ServiceInterface\InterfaceLocation\AppInterfaceLocationComposeServiceInterface:
        alias: App\Service\InterfaceLocation\AppInterfaceLocationComposeService
    App\Viewing\ServiceInterface\View\ViewInterfaceLocationComposeServiceInterface:
        alias: App\Service\InterfaceLocation\AppInterfaceLocationComposeService


    App\Provider\Cart\CartCatalogOfferProvider: ~
    App\Carting\ServiceInterface\Cart\CartOfferProviderInterface:
        alias: App\Provider\Cart\CartCatalogOfferProvider
    App\Carting\ServiceInterface\Cart\CartAvailabilityCheckerInterface:
        alias: App\Provider\Cart\CartCatalogOfferProvider

    App\Provider\Catalog\CatalogContextTreeProjectionProvider:
        tags: ['app.context_tree_projection_provider']
    App\Registry\Context\AppContextTreeProjectionRegistry:
        arguments:
            $providers: !tagged_iterator app.context_tree_projection_provider

    App\Normalizer\View\CrudResourceViewPayloadNormalizer:
        arguments:
            $inner: '@App\Viewing\Service\View\ViewPayloadNormalizer'
            $requestStack: '@request_stack'
            $contextTreeProjectionResolver: '@App\Resolver\Context\AppContextTreeProjectionResolver'
            $interfaceLocationProjectionProvider: '@?navigating.interface_location_projection_provider'
            $vendorPublicProfileSummaryProvider: '@App\Vendoring\ServiceInterface\Profile\VendorPublicProfileSummaryProviderServiceInterface'

    App\Viewing\Service\View\ViewPayloadNormalizer: ~
    App\Viewing\Service\View\ViewTemplateRenderer:
        arguments:
            $interfaceLocationComposeService: '@App\Service\InterfaceLocation\AppInterfaceLocationComposeService'
    App\Viewing\Subscriber\View\ViewKernelViewSubscriber:
        arguments:
            $payloadNormalizer: '@App\Normalizer\View\CrudResourceViewPayloadNormalizer'


when@dev:
    services:
        Doctrine\Bundle\FixturesBundle\Loader\SymfonyFixturesLoader: '@doctrine.fixtures.loader'
        App\DataFixtures\WalletDemoFixtures:
            autowire: true
            autoconfigure: true
        App\Service\Paying\PaymentDemoPayoutRailService:
            autowire: true
            autoconfigure: true
            tags: ['app.paying.payout_rail']
        App\Projecting\Http\Subscriber\VendorSlaRateLimitSubscriber:
            autowire: true
            autoconfigure: false
        App\EventSubscriber\Projecting\ProjectingVendorSlaRateLimitSubscriber:
            autowire: true
            autoconfigure: true
