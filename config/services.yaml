# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    redis.dsn: 'redis://127.0.0.1:6379/0'
    paying.messenger.dsn: 'sync://'
    app.back_uri_token_default: 'ea'
    app.back_uri_token: '%env(default:app.back_uri_token_default:APP_BACK_URI_TOKEN)%'
    app.object_visibility.transition_map:
        publish:
            writes:
                setPublished: true
                setVisible: true
        archive:
            writes:
                setArchived: true
                setVisible: false
        draft:
            writes:
                setDraft: true
                setPublished: false
                setVisible: false

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Fixture/'
            - '../src/DataFixtures/'
            - '../src/Kernel.php'

    App\Service\Dashboard\AppDashboardBuilderService:
        public: true
        arguments:
            $interfaceLocationProjectionProvider: '@navigating.interface_location_projection_provider'
        tags: ['controller.service_arguments']
    App\Service\Diagnostics\AppRouteAuditService:
        public: true
        tags: ['controller.service_arguments']
    App\Command\GatingCheckCommand:
        tags: ['console.command']
    doctrine.dbal.default_connection:
        alias: doctrine.dbal.postgres_connection

    App\Service\ObjectMeta\ObjectVisibilityManager:
        arguments:
            $transitionMap: '%app.object_visibility.transition_map%'

    App\Contract\Ui\AppDashboardContract: '@App\Service\Dashboard\AppDashboardBuilderService'
    App\Interfacing\ProviderInterface\Localization\InterfaceLocaleTemplateSelectorProviderInterface:
        alias: App\Interfacing\Provider\Localization\InterfaceDefaultLocaleTemplateSelectorProvider
    App\Interfacing\ProviderInterface\Localization\InterfaceLocaleTemplateContextProviderInterface:
        alias: App\Interfacing\Provider\Localization\InterfaceDefaultLocaleTemplateContextProvider
    App\ServiceInterface\InterfaceLocation\AppInterfaceLocationComposeServiceInterface:
        alias: App\Service\InterfaceLocation\AppInterfaceLocationComposeService
