# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    redis.dsn: 'redis://127.0.0.1:6379/0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Fixture/'
            - '../src/DataFixtures/'
            - '../src/Kernel.php'

    App\Fixture\GovernanceDemoSeeder: ~
    App\Service\Demo\FacetingDemoDatasetService: ~
    App\ServiceInterface\Demo\FacetingDemoDatasetServiceInterface: '@App\Service\Demo\FacetingDemoDatasetService'
    App\Service\Demo\OrderDemoDataService: ~

    App\ServiceInterface\VendorApiKeyServiceInterface: '@App\Service\VendorApiKeyService'
    App\Navigating\ServiceInterface\Navigation\NavigationRendererInterface: '@App\Service\Navigation\InterfacingNavigationRendererService'
    App\Service\Dashboard\AppDashboardBuilderService:
        public: true
    App\Service\Diagnostics\AppRouteAuditService:
        public: true
        tags: ['controller.service_arguments']
    doctrine.dbal.default_connection:
        alias: doctrine.dbal.postgres_connection

    App\Contract\Ui\AppDashboardContract: '@App\Service\Dashboard\AppDashboardBuilderService'
    App\Interfacing\ProviderInterface\Shell\InterfaceShellChromeProviderInterface: '@App\Service\Interfacing\Shell\ShellChromeProviderService'
    App\Interfacing\ProviderInterface\Commerce\InterfaceProjectShowcaseProviderInterface: '@App\Service\Interfacing\Commerce\DemoProjectShowcaseProviderService'
    App\Interfacing\ProviderInterface\Ecommerce\InterfaceEcommerceScreenCatalogProviderInterface: '@App\Service\Interfacing\Ecommerce\EcommerceScreenCatalogProviderService'
    App\Interfacing\ProviderInterface\Shell\InterfaceShellLayoutPreviewProviderInterface: '@App\Service\Interfacing\Shell\ShellLayoutPreviewProviderService'
    App\Interfacing\ProviderInterface\Shell\InterfaceShellScreenCatalogProviderInterface: '@App\Service\Interfacing\Shell\ShellScreenCatalogProviderService'

    App\Repository\Order\OrderRepository:
        tags: [ 'doctrine.repository_service' ]

    App\Twig\LocaleSelectorTwigExtension:
        tags: ['twig.extension']

    doctrine.orm.infrastructure_entity_manager:
        alias: doctrine.orm.sqlite_entity_manager

    App\Service\Navigation\InterfacingNavigationRendererService:
        arguments:
            $interfacingRenderer: '@App\Interfacing\ServiceInterface\Rendering\InterfaceRendererInterface'

    App\Routing\SiblingRoutesLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $connectedComponents: '%app.connected_components%'
        tags:
            - { name: 'routing.loader', type: 'sibling_routes' }

when@dev:
    services:
        Doctrine\Bundle\FixturesBundle\Loader\SymfonyFixturesLoader: '@doctrine.fixtures.loader'

imports:
    - { resource: '../../Administering/config/services.yaml' }
    - { resource: '../../Cruding/config/services.yaml' }
    - { resource: '../../Accessing/config/services.yaml' }
    - { resource: '../../Shipping/config/component/services.yaml' }
    - { resource: '../../Carting/config/services.yaml' }
    - { resource: '../../Observabiliting/config/services.yaml' }
    - { resource: '../../Vendoring/config/component/services.yaml' }
    - { resource: '../../Searching/config/packages/searching.yaml' }
    - { resource: '../../Navigating/config/services.yaml' }
    - { resource: '../../Ordering/config/component/services.yaml' }
    - { resource: '../../Ordering/config/packages/rate_limiter.php' }
    - { resource: '../../Paying/config/services.yaml' }
    - { resource: '../../Domaining/config/services.yaml' }
    - { resource: '../../Billing/config/component/services.yaml' }
    - { resource: '../../Currencing/config/packages/currencing.yaml' }
    - { resource: '../../Currencing/config/services/currencing.yaml' }
    - { resource: '../../Discovering/config/services.yaml' }
    - { resource: '../../Complying/config/services.yaml' }
    - { resource: '../../Subscripting/config/packages/subscription_runtime_prep.yaml' }
    - { resource: '../../Subscripting/config/services.yaml' }
