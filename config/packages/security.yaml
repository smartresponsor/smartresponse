security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory:
            memory:
                users: { }
        accessing_account_provider:
            entity:
                class: App\Accessing\Entity\AccessAccountEntity
                property: email

    role_hierarchy:
        ROLE_ACCOUNT: [ROLE_USER]
        ROLE_VIEWER: [ROLE_USER]
        ROLE_APPLICATION_VIEWER: [ROLE_VIEWER]
        ROLE_STAFF: [ROLE_USER]
        ROLE_SUPPORT: [ROLE_STAFF]
        ROLE_EDITOR: [ROLE_STAFF]
        ROLE_COPYWRITER: [ROLE_EDITOR]
        ROLE_MODERATOR: [ROLE_STAFF]
        ROLE_MANAGER: [ROLE_STAFF]
        ROLE_FINANCE: [ROLE_STAFF]
        ROLE_FINANCE_TAX_ADMIN: [ROLE_FINANCE]
        ROLE_APPLICATION_MANAGER: [ROLE_MANAGER]
        ROLE_ADMIN: [ROLE_APPLICATION_MANAGER, ROLE_MODERATOR, ROLE_SUPPORT, ROLE_FINANCE_TAX_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        public_auth:
            pattern: ^/(access|register|signup|recover|forgot-password|reset-password|login|verify)(?:/|$)
            security: false

        public_catalog_read:
            pattern: '^/api/catalog/category(?:/tree|/store|/search|/[^/]+)?$'
            methods: [GET]
            security: false

        main:
            pattern: ^/(?!(access|register|signup|recover|forgot-password|reset-password|login|verify)(?:/|$))
            lazy: true
            provider: accessing_account_provider
            custom_authenticators:
                - App\Accessing\Authenticator\AccessProgrammaticAuthenticator
                - App\Accessing\Authenticator\AccessBearerAuthenticator
            entry_point: App\Accessing\Authenticator\AccessAuthenticationEntryPoint
            logout:
                path: /sign-out
                target: access.signin
            switch_user:
                parameter: _switch_user
                role: ROLE_ALLOWED_TO_SWITCH

    # Note: Only the first matching rule is applied
    access_control:
        # Public/system
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/ready$, roles: PUBLIC_ACCESS }
        - { path: ^/access, roles: PUBLIC_ACCESS }
        - { path: '^/accessing/(signin|signup|login|recover|forgot-password|reset-password|verify)(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/recover, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/verify, roles: PUBLIC_ACCESS }
        - { path: ^/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/applicating/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/access(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/app(?:/|$), roles: PUBLIC_ACCESS }

        # 2FA
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        # Account area
        - { path: ^/sessions, roles: ROLE_ACCOUNT }
        - { path: ^/security-events, roles: ROLE_ACCOUNT }
        - { path: ^/accessing/second-factor/disable$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/second-factor, roles: ROLE_ACCOUNT }

        - { path: '^/api/taxation/taxability/(decide|trace)$', roles: ROLE_USER }

        # Category API
        - { path: ^/api/catalog/category/webhook/test, roles: ROLE_ADMIN }
        - { path: ^/api/catalog/category/tree, roles: PUBLIC_ACCESS }
        - { path: ^/api/catalog/category/store$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/catalog/category/search$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/catalog/category/[^/]+$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/catalog/category/publish/.+$', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/api/catalog/category/move/.+$', roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/catalog/category/attachment, roles: IS_AUTHENTICATED_FULLY }

        # Admin API
        - { path: ^/api/applicating, roles: ROLE_APPLICATION_MANAGER }
        - { path: ^/api/catalog/category, roles: ROLE_ADMIN }

        # Operator / support
        - { path: ^/operator, roles: ROLE_SUPPORT }

        # Admin UI
        - { path: '^/%app.back_uri_token%(/|$)', roles: ROLE_ADMIN }
        - { path: ^/manage, roles: [ROLE_ADMIN, ROLE_MODERATOR, ROLE_VIEWER, ROLE_APPLICATION_VIEWER] }
        - { path: '^/admin/$', roles: PUBLIC_ACCESS }
        - { path: '^/admin$', roles: PUBLIC_ACCESS }
        - { path: '^/admin/taxability/console$', roles: ROLE_FINANCE_TAX_ADMIN }
        - { path: ^/admin/category, roles: ROLE_ADMIN }
        - { path: ^/admin/system, roles: ROLE_ADMIN }
        - { path: ^/admin/moderation, roles: [ROLE_ADMIN, ROLE_MODERATOR] }
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_MODERATOR, ROLE_VIEWER, ROLE_APPLICATION_VIEWER] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
