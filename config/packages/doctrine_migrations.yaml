doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
        'App\Applicating\Migrations': '%kernel.project_dir%/vendor/applicating/application/migrations'
        'App\Domaining\Migrations': '%kernel.project_dir%/vendor/domaining/domain/migrations'
        'App\Addressing\Migrations': '%kernel.project_dir%/vendor/addressing/address/migrations'
        'App\Accessing\Migrations': '%kernel.project_dir%/vendor/accessing/access/migrations'
        'App\Retailing\Migrations': '%kernel.project_dir%/vendor/retailing/retail/migrations'
        'App\Attaching\Migrations': '%kernel.project_dir%/vendor/attaching/attachment/migrations'
        'App\Carting\Migrations': '%kernel.project_dir%/vendor/carting/cart/migrations'
        'DoctrineMigrations\Currencing': '%kernel.project_dir%/vendor/currencing/currency/migrations'
        'App\Cataloging\Migrations': '%kernel.project_dir%/vendor/cataloging/catalog/migrations'
        'App\Localizing\Migrations': '%kernel.project_dir%/vendor/localizing/locale/migrations'
        'App\Navigating\Migrations': '%kernel.project_dir%/vendor/navigating/navigation/migrations'
        'App\Casing\Migrations': '%kernel.project_dir%/vendor/casing/case/migrations'
        'App\Vendoring\Migrations': '%kernel.project_dir%/vendor/vendoring/vendor/migrations'
        'App\Projecting\Doctrine\Migrations': '%kernel.project_dir%/vendor/projecting/project/migrations'
        'App\Ordering\Migrations': '%kernel.project_dir%/vendor/ordering/order/migrations'
        'App\Paying\Migrations\Baseline': '%kernel.project_dir%/vendor/paying/payment/Migrations/baseline'
        'App\Shipping\Migrations\Baseline': '%kernel.project_dir%/vendor/shipping/shipment/migrations/baseline'
        'App\Paging\Migrations': '%kernel.project_dir%/../Paging/migrations'
        'App\Walleting\Migrations': '%kernel.project_dir%/vendor/walleting/wallet/migrations'
        'App\Withdrawing\Migrations': '%kernel.project_dir%/vendor/smartresponsor/withdrawing/migrations'
    enable_profiler: false

when@dev:
    doctrine_migrations:
        migrations_paths:
            # namespace is arbitrary but should be different from App\Migrations
            # as migrations classes should NOT be autoloaded
            'App\Applicating\Migrations': '%kernel.project_dir%/vendor/applicating/application/migrations'
            'App\Domaining\Migrations': '%kernel.project_dir%/vendor/domaining/domain/migrations'
            'App\Retailing\Migrations': '%kernel.project_dir%/vendor/retailing/retail/migrations'
            'App\Carting\Migrations': '%kernel.project_dir%/vendor/carting/cart/migrations'
            'DoctrineMigrations\Currencing': '%kernel.project_dir%/vendor/currencing/currency/migrations'
            'App\Cataloging\Migrations': '%kernel.project_dir%/../Cataloging/migrations'
            'App\Localizing\Migrations': '%kernel.project_dir%/../Localizing/migrations'
            'App\Navigating\Migrations': '%kernel.project_dir%/../Navigating/migrations'
            'App\Casing\Migrations': '%kernel.project_dir%/../Casing/migrations'
            'App\Attaching\Migrations': '%kernel.project_dir%/../Attaching/migrations'
            'App\Vendoring\Migrations': '%kernel.project_dir%/vendor/vendoring/vendor/migrations'
            'App\Projecting\Doctrine\Migrations': '%kernel.project_dir%/../Projecting/migrations'
            'App\Ordering\Migrations': '%kernel.project_dir%/../Ordering/migrations'
            'App\Paying\Migrations\Baseline': '%kernel.project_dir%/../Paying/Migrations/baseline'
            'App\Shipping\Migrations\Baseline': '%kernel.project_dir%/../Shipping/migrations/baseline'
            # Administering currently owns no Doctrine migrations.
            # Commercializing currently owns no available Doctrine migrations.
            # Exchanging currently owns no available Doctrine migrations.
            # Tagging currently owns no available Doctrine migrations.
            # Commissioning currently owns no available Doctrine migrations.
            'App\Paging\Migrations': '%kernel.project_dir%/../Paging/migrations'
            'App\Walleting\Migrations': '%kernel.project_dir%/vendor/walleting/wallet/migrations'
            'App\Withdrawing\Migrations': '%kernel.project_dir%/vendor/smartresponsor/withdrawing/migrations'
            'App\Messaging\Migrations\Baseline': '%kernel.project_dir%/../Messaging/migrations/baseline'
            'App\Notifying\Migrations\Baseline': '%kernel.project_dir%/../Notifying/migrations/baseline'
