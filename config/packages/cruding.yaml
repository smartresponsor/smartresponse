# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/dic/services.schema.json
# Route Governance W3: generic collection CRUD belongs to Cruding.
# Producer controllers must not declare standalone collection index/create routes such as
# /api/orders, /api/payments, /api/products, /api/projects, /api/categories, /api/messages,
# /api/attachments, or /api/vendors. Business commands remain producer-owned.
cruding:
    route_guard:
        runtime_entity_env: APP_RUNTIME_ENTITY_FROM_LOCK
        runtime_lock_glob: config/kernel/runtime_scope.{env}.lock.php
    entity_class_alias_map:
        vendor: 'App\Vendoring\Entity\Vendor\VendorEntity'
        domain/declaration: 'App\Domaining\Entity\DomainDeclaration'
        attachment: 'App\Attaching\Entity\Attachment\Attachment'
        task: 'App\Retailing\Entity\Retail\RetailEntity'
        service: 'App\Retailing\Entity\Retail\RetailEntity'
        product: 'App\Retailing\Entity\Retail\RetailEntity'
        message: 'App\Messaging\Entity\Message\MessageEntity'
        order: 'App\Ordering\Entity\Order\OrderEntity'
        shipment: 'App\Shipping\Entity\Shipping\ShipmentEntity'
        payment: 'App\Paying\Entity\PaymentEntity'
        wallet: 'App\Walleting\Entity\Wallet'
        account: 'App\Walleting\Entity\Account'
        reservation: 'App\Walleting\Entity\Reservation'
        funding: 'App\Walleting\Entity\Funding'
        withdrawal: 'App\Walleting\Entity\Withdrawal'
        payment-instrument: 'App\Walleting\Entity\PaymentInstrument'
        project: 'App\Projecting\Entity\Project\ProjectEntity'
        retail: 'App\Retailing\Entity\Retail\RetailEntity'
        catalog: 'App\Cataloging\Entity\Catalog\CatalogCatalogEntity'
        category: 'App\Cataloging\Entity\Catalog\CatalogCategoryEntity'
        page: 'App\Paging\Entity\Page'
        page-revision: 'App\Paging\Entity\PageRevision'
        page-publication: 'App\Paging\Entity\PagePublication'
        page-grant: 'App\Paging\Entity\PageGrant'
        page-acceptance: 'App\Paging\Entity\PageAcceptance'
    form_type_map:
        'App\Domaining\Entity\DomainDeclaration': 'App\Domaining\Form\DomainDeclarationType'
        'App\Retailing\Entity\Retail\RetailEntity': 'App\Retailing\Form\Retail\RetailType'
