nelmio_api_doc:
    documentation:
        info:
            title: App Host Dashboard API
            description: Host-owned API documentation for stable owner-root routes exposed by the application shell.
            version: 1.0.1
        components:
            schemas:
                Problem:
                    type: object
                    properties:
                        type: { type: string, example: about:blank }
                        title: { type: string, example: Not Found }
                        status: { type: integer, example: 404 }
                        detail: { type: string, example: Resource not found. }
                        errors:
                            type: array
                            items:
                                type: object
                                properties:
                                    field: { type: string, nullable: true }
                                    message: { type: string }
                DashboardPayload:
                    type: object
                    additionalProperties: true
                TaxabilityDecision:
                    type: object
                    additionalProperties: true
                CategoryTree:
                    type: object
                    additionalProperties: true
            responses:
                ProblemBadRequest:
                    description: Bad request.
                    content:
                        application/problem+json:
                            schema: { $ref: '#/components/schemas/Problem' }
                ProblemForbidden:
                    description: Forbidden.
                    content:
                        application/problem+json:
                            schema: { $ref: '#/components/schemas/Problem' }
                ProblemNotFound:
                    description: Not found.
                    content:
                        application/problem+json:
                            schema: { $ref: '#/components/schemas/Problem' }
        paths:
            /api/applicating/doc/json:
                get:
                    tags: ['Applicating']
                    operationId: applicatingDocJson
                    summary: Return the application API documentation payload.
                    responses:
                        '200': { description: API documentation payload returned. }
            /api/taxation/taxability/decide:
                post:
                    tags: ['Taxation']
                    operationId: taxationTaxabilityDecide
                    summary: Decide taxability for one submitted transaction context.
                    responses:
                        '200':
                            description: Taxability decision returned.
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/TaxabilityDecision' }
                        '400': { $ref: '#/components/responses/ProblemBadRequest' }
                        '403': { $ref: '#/components/responses/ProblemForbidden' }
            /api/taxation/taxability/trace:
                post:
                    tags: ['Taxation']
                    operationId: taxationTaxabilityTrace
                    summary: Return the trace for one taxability decision context.
                    responses:
                        '200': { description: Taxability trace returned. }
                        '400': { $ref: '#/components/responses/ProblemBadRequest' }
                        '403': { $ref: '#/components/responses/ProblemForbidden' }
            /api/catalog/category/tree:
                get:
                    tags: ['Catalog']
                    operationId: catalogCategoryTree
                    summary: Return the public category tree.
                    responses:
                        '200':
                            description: Category tree returned.
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/CategoryTree' }
            /api/catalog/category/webhook/test:
                post:
                    tags: ['Catalog']
                    operationId: catalogCategoryWebhookTest
                    summary: Run the category webhook test endpoint.
                    responses:
                        '200': { description: Webhook test accepted. }
                        '403': { $ref: '#/components/responses/ProblemForbidden' }
            /api/catalog/category/publish/{id}:
                post:
                    tags: ['Catalog']
                    operationId: catalogCategoryPublish
                    summary: Publish one category by terminal identifier.
                    parameters:
                        - { in: path, name: id, required: true, schema: { type: string } }
                    responses:
                        '200': { description: Category published. }
                        '403': { $ref: '#/components/responses/ProblemForbidden' }
                        '404': { $ref: '#/components/responses/ProblemNotFound' }
            /api/catalog/category/move/{id}:
                post:
                    tags: ['Catalog']
                    operationId: catalogCategoryMove
                    summary: Move one category by terminal identifier using body/query context for the target.
                    parameters:
                        - { in: path, name: id, required: true, schema: { type: string } }
                    responses:
                        '200': { description: Category moved. }
                        '400': { $ref: '#/components/responses/ProblemBadRequest' }
                        '403': { $ref: '#/components/responses/ProblemForbidden' }
                        '404': { $ref: '#/components/responses/ProblemNotFound' }
            /api/billing/meter:
                get:
                    tags: ['Billing']
                    operationId: billingMeterDashboard
                    summary: Return the billing meter dashboard payload.
                    responses:
                        '200':
                            description: Billing meter dashboard returned.
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/DashboardPayload' }
            /api/order/summary:
                get:
                    tags: ['Order']
                    operationId: orderSummaryDashboard
                    summary: Return the order summary dashboard payload.
                    responses:
                        '200':
                            description: Order summary dashboard returned.
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/DashboardPayload' }
    areas:
        path_patterns:
            - ^/api(?!/applicating/doc$)
