# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Host route map.
# Generic producer CRUD/surface routes are intentionally not imported here.
# Native EasyAdmin dashboards/components are imported directly from their owning apps.
# Cruding owns generic CRUD/catch-all route grammar; Viewing handles returned payloads;
# Interfacing provides rendering surfaces/templates.

app_host_dashboard:
    resource: routes/app_host_dashboard.yaml

app_route_audit:
    resource: routes/app_route_audit.yaml

administering_admin_attribute:
    resource: '../../Administering/src/Controller/Admin/'
    type: attribute

manage_easyadmin_routes:
    resource: '../../Managing/config/routes/managing.yaml'

# Interfacing and Viewing are platform layers, not producer route owners.
interfacing_routes:
    resource: '../../Interfacing/config/routes/interfacing_attributes.yaml'

viewing_routes:
    resource: '../../Viewing/Resources/config/routes.php'

accessing_routes:
    resource: '../../Accessing/config/component/routes.yaml'

notification_index:
    path: /notification/
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
    defaults:
        path: /interfacing/
        permanent: false

cruding:
    resource: '@CrudingBundle/config/routes.yaml'
