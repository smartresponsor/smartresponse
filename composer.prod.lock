                "url": "git@github.com:smartresponsor/projecting.git",
                "reference": "cd4de712bf6f1216c3b00265f112401d15548851"
            },
            "require": {
                "collectioning/collection": "dev-master",
                "cruding/crud": "dev-master",
                "doctrine/collections": "^2.2",
                "doctrine/dbal": "^4.0",
                "doctrine/doctrine-bundle": "^2.13 || ^3.0",
                "doctrine/doctrine-migrations-bundle": "^4.0",
                "doctrine/migrations": "^3.6",
                "doctrine/orm": "^3.3",
                "easycorp/easyadmin-bundle": "^5.5",
                "ext-json": "*",
                "failing/failure": "dev-master",
                "interfacing/interface": "dev-master",
                "moneyphp/money": "^4.6",
                "nelmio/api-doc-bundle": "^5.11",
                "nyholm/psr7": "^1.8",
                "objecting/object": "dev-master",
                "open-telemetry/exporter-otlp": "^1.0",
                "open-telemetry/sdk": "^1.0",
                "php": "^8.4",
                "psr/log": "^3.0",
                "symfony/cache": "^8.1",
                "symfony/console": "^8.1",
                "symfony/form": "^8.1",
                "symfony/framework-bundle": "^8.1",
                "symfony/http-client": "^8.1",
                "symfony/messenger": "^8.1",
                "symfony/rate-limiter": "^8.1",
                "symfony/runtime": "^8.1",
                "symfony/security-bundle": "^8.1",
                "symfony/serializer": "^8.1",
                "symfony/workflow": "^8.1",
                "symfony/yaml": "^8.1",
                "tabling/table": "dev-master",
                "viewing/view": "dev-master"
            },
            "require-dev": {
                "administering/administration": "dev-master",
                "friendsofphp/php-cs-fixer": "^3.94",
                "gating/gate": "dev-master",
                "phpstan/phpstan": "^2.1",
                "phpstan/phpstan-doctrine": "^2.0",
                "phpunit/phpunit": "^13.3",
                "symfony/browser-kit": "^8.1",
                "symfony/css-selector": "^8.1",
                "symfony/dom-crawler": "^8.1",
                "symfony/panther": "^2.4",
                "symfony/test-pack": "^1.2"
            },
            "type": "symfony-bundle",
            "autoload": {
                "psr-4": {
                    "App\\Projecting\\": "src/"
                }
            },
            "scripts": {
                "test": [
                    "phpunit --colors=always"
                ],
                "test:coverage": [
                    "@php -d memory_limit=-1 tool/test-coverage-sharded.php --coverage-text=var/coverage-summary.txt"
                ],
                "test:coverage:path-smoke": [
                    "@php -d memory_limit=-1 -d xdebug.mode=coverage vendor/bin/phpunit tests/Unit/Project/ProjectingObjectIdentityContractTest.php --coverage-text=var/coverage-path-smoke.txt --path-coverage"
                ],
                "test:coverage:summary": [
                    "@php -d memory_limit=-1 tool/test-coverage-sharded.php --coverage-text=var/coverage-summary.txt"
                ],
                "test:object-identity": [
                    "phpunit --colors=always tests/Unit/Project/ProjectingObjectIdentityContractTest.php"
                ],
                "test:behavioral-coverage": [
                    "@php tool/generate-behavioral-ui-coverage.php"
                ],
                "route:callables": [
                    "@php tool/check-route-callables.php"
                ],
                "lint": [
                    "php bin/php-lint.php"
                ],
                "php-cs-fixer": [
                    "php-cs-fixer fix --dry-run --diff --verbose"
                ],
                "phpstan": [
                    "phpstan analyse -c phpstan.neon"
                ],
                "gating": [
                    "@php -d auto_prepend_file=vendor/autoload.php vendor/bin/gating check --target=. --profile=config/gating/project_gating.yaml"
                ],
                "schema:validate": [
                    "php bin/console doctrine:schema:validate --skip-sync --env=test"
                ],
                "schema:parity": [
                    "php bin/console doctrine:schema:validate --skip-sync --env=test --no-interaction",
                    "php bin/console doctrine:migrations:up-to-date --env=test --no-interaction"
                ],
                "start:dev": [
                    "php -S 127.0.0.1:8080 -t public"
                ],
                "consume": [
                    "php -d variables_order=EGPCS -r \"passthru('php bin/console messenger:consume async -vv', $e); exit($e);\""
                ],
                "retry-failed": [
                    "php -r \"passthru('php bin/console messenger:failed:retry --force', $e); exit($e);\""
                ],
                "gate": [
                    "@php vendor/bin/gating check --target=."
                ],
                "quality": [
                    "@phpstan",
                    "@test",
                    "@gate"
                ]
            },
            "license": [
                "PolyForm-Noncommercial-1.0.0"
            ],
            "description": "Projecting standalone Symfony application and reusable Symfony bundle"
        },
