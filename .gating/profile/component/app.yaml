component:
  name: App
  nameEntity: app
  namespace: App
  business_prefix: App
  database_prefix: app_
  route_owner_root: app
  route_owner_roots:
    - app
    - interfacing
    - applicating
    - notification
    - navigation
    - vendor
    - manage
  route_excluded_names:
    - 2fa_login
    - 2fa_login_check
  typed_layers_required: true
  service_interface_mirror: true
  mutation_mode: forbidden

  secret_scan: enabled
  docblock_preservation: enabled
  release:
    evidence_required: false
    required_files:
      - composer.json
      - symfony.lock
